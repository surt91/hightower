<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hightower line router</title>
    <link data-trunk rel="rust" data-wasm-opt="2" />
    <base data-trunk-public-url />
    <style>
        html { touch-action: manipulation; }
        html, body { overflow: hidden; margin: 0; padding: 0; height: 100%; width: 100%; background: #ffffff; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .centered {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #444; font-size: 18px; font-family: Helvetica, Arial, sans-serif; text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="hightower_canvas"></canvas>
    <div class="centered" id="loading_text">
        <noscript>This demo needs JavaScript and WebAssembly.</noscript>
        <p>Loading…</p>
    </div>
</body>
</html>
