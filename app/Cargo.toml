[package]
name = "hightower-app"
version = "0.1.0"
edition = "2024"
description = "Interactive demo of Hightower's line router: move boxes and endpoints, watch the path follow"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
hightower = { path = ".." }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
